repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-docstring-first
          - id: trailing-whitespace
          - id: check-yaml
    - repo: https://github.com/psf/black-pre-commit-mirror
      rev: 26.5.1
      hooks:
          - id: black
